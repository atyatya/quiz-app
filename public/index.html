<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クイズ大会 - 回答者</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>🎯 クイズ大会</h1>

  <!-- ログイン -->
  <section id="login" class="card hidden">
    <h2>回答者として参加</h2>
    <form id="loginForm" class="row">
      <input id="nameInput" class="grow" placeholder="表示名（20文字まで）" maxlength="20" autocomplete="off" required>
      <button>参加する</button>
    </form>
    <p class="error" id="loginError"></p>
    <p class="muted">出題者の方は <a href="/host">こちら</a></p>
  </section>

  <!-- ゲーム画面 -->
  <section id="game" class="hidden">
    <div class="card row">
      <div class="grow"><strong id="myName"></strong> さん</div>
      <div>得点 <strong id="myScore">0</strong></div>
    </div>

    <div class="card" id="stage"></div>

    <div class="card">
      <h2>ランキング</h2>
      <table><tbody id="ranking"></tbody></table>
    </div>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/player.js"></script>
</body>
</html>
